<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" role="img" aria-label="moumenlab">
  <!-- Fixed-ink form of the mark: solid black, no theme switching. logo.svg
       follows the browser chrome and flips to white on a dark ground, which is
       wrong wherever the ground is known and stays light - README badges, print,
       a partner's press page, anything embedded where the media query would
       read the viewer's OS instead of the surface the mark actually sits on.
       Same geometry and same pixel snapping as logo.svg; only the ink differs. -->
  <rect x="7" y="7" width="18" height="18" rx="4.5" stroke="#000000" stroke-width="2"/>
  <circle cx="7" cy="7" r="3.5" fill="#000000"/>
  <circle cx="25" cy="25" r="3.5" fill="#000000"/>
</svg>
