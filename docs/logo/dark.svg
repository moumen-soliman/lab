<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" role="img" aria-label="moumenlab">
  <!-- Fixed-ink form for dark grounds, the counterpart to logo-black.svg.
       Needed because GitHub renders a README in whichever theme the reader
       chose, and it serves this through <picture> rather than letting the SVG
       decide: a media query inside an SVG loaded as an image reads the reader's
       OS setting, which is not the same thing as the theme the page is drawn in.
       Same geometry and pixel snapping as logo.svg; only the ink differs. -->
  <rect x="7" y="7" width="18" height="18" rx="4.5" stroke="#ffffff" stroke-width="2"/>
  <circle cx="7" cy="7" r="3.5" fill="#ffffff"/>
  <circle cx="25" cy="25" r="3.5" fill="#ffffff"/>
</svg>
